version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_rag_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - MOCK_EXTERNAL_SERVICES=${MOCK_EXTERNAL_SERVICES:-true}
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice_rag_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_storage:
